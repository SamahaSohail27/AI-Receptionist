<!DOCTYPE html>
<html lang="en" x-data :class="{'dark': $store.app.darkMode}">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Medical Receptionist{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Nastaliq+Urdu:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .urdu-text { font-family: 'Noto Nastaliq Urdu', serif; line-height: 2.2; direction: rtl; }
    .sidebar-width { width: 256px; }
    .sidebar-collapsed { width: 72px; }
    .header-height { height: 64px; }
    .main-content { margin-top: 64px; }
    .transition-sidebar { transition: width 0.3s ease; }
    @keyframes pulse-emergency {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.7); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }
    .emergency-pulse { animation: pulse-emergency 1.5s infinite; }
    .skeleton { background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%); background-size: 200% 100%; animation: skeleton-shimmer 1.5s infinite; }
    @keyframes skeleton-shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
    .nav-item { transition: background-color 0.15s ease, color 0.15s ease; }
    .nav-item:hover { background-color: rgba(14,165,233,0.12); }
    .nav-item.active { background-color: rgba(14,165,233,0.2); color: #0EA5E9; border-right: 3px solid #0EA5E9; }
  </style>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: '#0EA5E9',
            teal: { DEFAULT: '#14B8A6' },
            brand: { 900: '#0F172A', 800: '#1E293B' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen" x-data>

  <!-- Alpine Store Init -->
  <script>
    document.addEventListener('alpine:init', () => {
      Alpine.store('app', {
        darkMode: localStorage.getItem('darkMode') !== 'false',
        sidebarCollapsed: false,
        user: JSON.parse(localStorage.getItem('user') || 'null'),
        token: localStorage.getItem('token') || '',
        notifications: [],
        activeCalls: 0,
        wsConnected: false,
        ws: null,

        init() {
          if (this.token) this.connectWS();
        },

        connectWS() {
          try {
            this.ws = new WebSocket(`ws://${location.host}/ws`);
            this.ws.onopen = () => { this.wsConnected = true; };
            this.ws.onmessage = (e) => this.handleWSEvent(JSON.parse(e.data));
            this.ws.onclose = () => { this.wsConnected = false; setTimeout(() => this.connectWS(), 3000); };
            this.ws.onerror = () => { this.wsConnected = false; };
          } catch(err) { this.wsConnected = false; }
        },

        handleWSEvent(event) {
          if (event.type === 'call.started') this.activeCalls++;
          if (event.type === 'call.ended') this.activeCalls = Math.max(0, this.activeCalls - 1);
          if (event.type === 'call.emergency') {
            this.notifications.unshift({ id: Date.now(), type: 'emergency', text: 'EMERGENCY CALL — ' + (event.phone || 'Unknown'), time: new Date().toLocaleTimeString() });
            setTimeout(() => { this.notifications = this.notifications.filter(n => n.id !== this.notifications[0]?.id); }, 10000);
          }
          document.dispatchEvent(new CustomEvent('ws-event', { detail: event }));
        },

        async login(email, password) {
          const resp = await fetch('/api/v1/auth/token', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: `username=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`
          });
          if (resp.ok) {
            const data = await resp.json();
            this.token = data.access_token;
            this.user = { id: data.user_id, role: data.role, name: data.name || email };
            localStorage.setItem('token', this.token);
            localStorage.setItem('user', JSON.stringify(this.user));
            this.connectWS();
            return true;
          }
          return false;
        },

        logout() {
          this.token = ''; this.user = null;
          if (this.ws) this.ws.close();
          localStorage.removeItem('token'); localStorage.removeItem('user');
          location.href = '/login';
        },

        async api(path, options = {}) {
          const resp = await fetch('/api/v1' + path, {
            ...options,
            headers: { 'Authorization': 'Bearer ' + this.token, 'Content-Type': 'application/json', ...(options.headers || {}) }
          });
          if (resp.status === 401) { this.logout(); return null; }
          return resp;
        },

        addNotification(type, text) {
          const id = Date.now();
          this.notifications.unshift({ id, type, text, time: new Date().toLocaleTimeString() });
          setTimeout(() => { this.notifications = this.notifications.filter(n => n.id !== id); }, 5000);
        }
      });
    });
  </script>

  <!-- Sidebar -->
  <aside
    :class="$store.app.sidebarCollapsed ? 'sidebar-collapsed' : 'sidebar-width'"
    class="fixed left-0 top-0 bottom-0 z-40 bg-slate-800 border-r border-slate-700 flex flex-col transition-sidebar overflow-hidden"
    x-data="{ settingsOpen: false }">

    <!-- Logo -->
    <div class="header-height flex items-center px-4 border-b border-slate-700 flex-shrink-0">
      <div class="flex items-center gap-3 min-w-0">
        <div class="w-9 h-9 rounded-xl bg-sky-500 flex items-center justify-center flex-shrink-0">
          <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/>
          </svg>
        </div>
        <span class="font-bold text-sm text-slate-100 truncate" x-show="!$store.app.sidebarCollapsed">AI Receptionist</span>
      </div>
    </div>

    <!-- Nav -->
    <nav class="flex-1 overflow-y-auto py-4 space-y-1 px-2">

      <!-- Dashboard -->
      <a href="/" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
        </svg>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium">Dashboard</span>
      </a>

      <!-- Test Session -->
      <a href="/test-session" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11a7 7 0 01-14 0m7 7v4m-4 0h8M9 7a3 3 0 116 0v4a3 3 0 01-6 0V7z"/>
        </svg>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium">Test Session</span>
      </a>

      <!-- Live Calls -->
      <a href="/calls/live" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
        <div class="relative flex-shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
          </svg>
          <span x-show="$store.app.activeCalls > 0" x-text="$store.app.activeCalls" class="absolute -top-1.5 -right-1.5 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold"></span>
        </div>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium flex-1">Live Calls</span>
        <span x-show="!$store.app.sidebarCollapsed && $store.app.activeCalls > 0" x-text="$store.app.activeCalls" class="bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold animate-pulse"></span>
      </a>

      <!-- Call History -->
      <a href="/calls/history" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium">Call History</span>
      </a>

      <!-- Appointments -->
      <a href="/appointments" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium">Appointments</span>
      </a>

      <!-- Patients -->
      <a href="/patients" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium">Patients</span>
      </a>

      <!-- Doctors -->
      <a href="/doctors" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
        </svg>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium">Doctors</span>
      </a>

      <!-- Analytics -->
      <a href="/analytics" class="nav-item flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
        <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
        </svg>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium">Analytics</span>
      </a>

      <!-- Settings Dropdown -->
      <div>
        <button @click="settingsOpen = !settingsOpen" class="nav-item w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-slate-300 hover:text-slate-100">
          <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
          </svg>
          <span x-show="!$store.app.sidebarCollapsed" class="text-sm font-medium flex-1 text-left">Settings</span>
          <svg x-show="!$store.app.sidebarCollapsed" :class="settingsOpen ? 'rotate-180' : ''" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>
        <div x-show="settingsOpen && !$store.app.sidebarCollapsed" x-transition class="ml-6 mt-1 space-y-1">
          <a href="/settings/providers" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-700 text-sm">Providers</a>
          <a href="/settings/language" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-700 text-sm">Language</a>
          <a href="/settings/clinic" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-700 text-sm">Clinic</a>
          <a href="/settings/users" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-700 text-sm">Users</a>
          <a href="/settings/health" class="flex items-center gap-2 px-3 py-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-700 text-sm">Health</a>
        </div>
      </div>

    </nav>

    <!-- Sidebar Footer: Collapse Toggle -->
    <div class="border-t border-slate-700 p-3 flex-shrink-0">
      <button @click="$store.app.sidebarCollapsed = !$store.app.sidebarCollapsed" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-slate-400 hover:text-slate-100 hover:bg-slate-700 transition-colors">
        <svg :class="$store.app.sidebarCollapsed ? 'rotate-180' : ''" class="w-5 h-5 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
        </svg>
        <span x-show="!$store.app.sidebarCollapsed" class="text-sm">Collapse</span>
      </button>
    </div>
  </aside>

  <!-- Header -->
  <header
    :style="$store.app.sidebarCollapsed ? 'left: 72px' : 'left: 256px'"
    class="fixed top-0 right-0 z-30 bg-slate-800 border-b border-slate-700 header-height flex items-center px-6 gap-4 transition-all duration-300">

    <!-- Clinic Name -->
    <div class="flex-1 min-w-0">
      <h1 class="text-base font-semibold text-slate-100 truncate">
        {% block page_title %}AI Medical Receptionist{% endblock %}
      </h1>
    </div>

    <!-- System Health Dot -->
    <div x-data="{ health: 'good' }" class="flex items-center gap-2">
      <span class="text-xs text-slate-400">System</span>
      <div :class="{
        'bg-green-500': health === 'good',
        'bg-yellow-500': health === 'warn',
        'bg-red-500': health === 'bad'
      }" class="w-2.5 h-2.5 rounded-full animate-pulse"></div>
    </div>

    <!-- WS Status -->
    <div class="flex items-center gap-1.5">
      <div :class="$store.app.wsConnected ? 'bg-teal-500' : 'bg-slate-600'" class="w-2 h-2 rounded-full"></div>
      <span x-text="$store.app.wsConnected ? 'Live' : 'Offline'" class="text-xs text-slate-400"></span>
    </div>

    <!-- Dark Mode Toggle -->
    <button @click="$store.app.darkMode = !$store.app.darkMode; localStorage.setItem('darkMode', $store.app.darkMode)" class="p-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-700 transition-colors">
      <svg x-show="$store.app.darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
      </svg>
      <svg x-show="!$store.app.darkMode" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
      </svg>
    </button>

    <!-- Notifications Bell -->
    <div x-data="{ open: false }" class="relative">
      <button @click="open = !open" class="relative p-2 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-700 transition-colors">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
        </svg>
        <span x-show="$store.app.notifications.length > 0" x-text="$store.app.notifications.length" class="absolute -top-1 -right-1 bg-red-500 text-white text-xs rounded-full w-4 h-4 flex items-center justify-center font-bold"></span>
      </button>
      <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 top-12 w-80 bg-slate-800 border border-slate-700 rounded-xl shadow-xl z-50">
        <div class="p-3 border-b border-slate-700">
          <h3 class="text-sm font-semibold text-slate-100">Notifications</h3>
        </div>
        <div class="max-h-64 overflow-y-auto">
          <template x-if="$store.app.notifications.length === 0">
            <p class="text-slate-400 text-sm text-center py-6">No notifications</p>
          </template>
          <template x-for="n in $store.app.notifications" :key="n.id">
            <div :class="n.type === 'emergency' ? 'bg-red-900/30 border-l-2 border-red-500' : 'border-l-2 border-sky-500'" class="px-4 py-3">
              <p class="text-sm font-medium text-slate-100" x-text="n.text"></p>
              <p class="text-xs text-slate-400 mt-0.5" x-text="n.time"></p>
            </div>
          </template>
        </div>
      </div>
    </div>

    <!-- User Menu -->
    <div x-data="{ open: false }" class="relative">
      <button @click="open = !open" class="flex items-center gap-2 px-3 py-2 rounded-xl hover:bg-slate-700 transition-colors">
        <div class="w-8 h-8 rounded-full bg-sky-500 flex items-center justify-center text-white text-sm font-bold" x-text="$store.app.user?.name ? $store.app.user.name[0].toUpperCase() : 'U'"></div>
        <span class="text-sm text-slate-300 hidden sm:block" x-text="$store.app.user?.name || 'User'"></span>
        <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
        </svg>
      </button>
      <div x-show="open" @click.away="open = false" x-transition class="absolute right-0 top-12 w-48 bg-slate-800 border border-slate-700 rounded-xl shadow-xl z-50">
        <div class="p-3 border-b border-slate-700">
          <p class="text-sm font-medium text-slate-100" x-text="$store.app.user?.name || 'User'"></p>
          <p class="text-xs text-slate-400 mt-0.5 capitalize" x-text="$store.app.user?.role || 'staff'"></p>
        </div>
        <div class="p-2">
          <button @click="$store.app.logout()" class="w-full flex items-center gap-2 px-3 py-2 rounded-lg text-red-400 hover:bg-red-900/30 text-sm transition-colors">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
            </svg>
            Sign Out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main
    :style="$store.app.sidebarCollapsed ? 'margin-left: 72px' : 'margin-left: 256px'"
    class="main-content transition-all duration-300 min-h-screen bg-slate-900">
    <div class="p-6">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Toast Notifications (Emergency) -->
  <div class="fixed bottom-6 right-6 z-50 space-y-3 max-w-sm w-full pointer-events-none">
    <template x-for="n in $store.app.notifications.filter(n => n.type === 'emergency')" :key="n.id">
      <div class="pointer-events-auto bg-red-600 border border-red-400 rounded-xl shadow-lg p-4 flex items-start gap-3 emergency-pulse animate-pulse">
        <div class="flex-shrink-0 w-8 h-8 bg-red-800 rounded-full flex items-center justify-center">
          <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </div>
        <div class="flex-1 min-w-0">
          <p class="text-white font-bold text-sm" x-text="n.text"></p>
          <p class="text-red-200 text-xs mt-0.5" x-text="n.time"></p>
        </div>
      </div>
    </template>
  </div>

  <!-- General Toast Notifications -->
  <div class="fixed bottom-6 right-6 z-40 space-y-3 max-w-sm w-full pointer-events-none" style="bottom: 6rem;">
    <template x-for="n in $store.app.notifications.filter(n => n.type !== 'emergency')" :key="n.id">
      <div :class="{
        'bg-green-800 border-green-600': n.type === 'success',
        'bg-yellow-800 border-yellow-600': n.type === 'warning',
        'bg-slate-800 border-slate-600': n.type === 'info'
      }" class="pointer-events-auto border rounded-xl shadow-lg p-4 flex items-start gap-3">
        <div class="flex-1 min-w-0">
          <p class="text-slate-100 text-sm font-medium" x-text="n.text"></p>
          <p class="text-slate-400 text-xs mt-0.5" x-text="n.time"></p>
        </div>
        <button @click="$store.app.notifications = $store.app.notifications.filter(x => x.id !== n.id)" class="text-slate-400 hover:text-slate-200 flex-shrink-0">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </template>
  </div>

  {% block scripts %}{% endblock %}
</body>
</html>
