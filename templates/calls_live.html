{% extends "base.html" %}
{% block title %}Live Calls — AI Medical Receptionist{% endblock %}
{% block page_title %}Live Call Monitor{% endblock %}

{% block content %}
<div
  x-data="{
    calls: [],
    selectedCall: null,
    overrideLangModal: false,
    selectedLang: 'ur',

    init() {
      document.addEventListener('ws-event', (e) => this.handleEvent(e.detail));
    },

    handleEvent(ev) {
      if (ev.type === 'call.started') {
        this.calls.push({
          id: ev.session_id,
          phone: ev.phone || '03001234567',
          language: ev.language || 'ur',
          state: 'connected',
          emergency: false,
          micLevel: 0,
          latency: { stt: 0, llm: 0, tts: 0, total: 0 },
          transcript: [],
          startedAt: new Date(),
          elapsedSecs: 0
        });
        const c = this.calls[this.calls.length - 1];
        c._timer = setInterval(() => { c.elapsedSecs++; }, 1000);
      }

      if (ev.type === 'call.ended') {
        const c = this.calls.find(c => c.id === ev.session_id);
        if (c && c._timer) clearInterval(c._timer);
        this.calls = this.calls.filter(c => c.id !== ev.session_id);
        if (this.selectedCall === ev.session_id) this.selectedCall = null;
      }

      if (ev.type === 'call.emergency') {
        const c = this.calls.find(c => c.id === ev.session_id);
        if (c) c.emergency = true;
      }

      if (ev.type === 'state_changed') {
        const c = this.calls.find(c => c.id === ev.session_id);
        if (c) c.state = ev.state;
      }

      if (ev.type === 'audio_level') {
        const c = this.calls.find(c => c.id === ev.session_id);
        if (c) c.micLevel = Math.min(100, Math.round(ev.level * 100));
      }

      if (ev.type === 'call.latency') {
        const c = this.calls.find(c => c.id === ev.session_id);
        if (c) c.latency = { stt: ev.stt_ms || 0, llm: ev.llm_ms || 0, tts: ev.tts_ms || 0, total: (ev.stt_ms || 0) + (ev.llm_ms || 0) + (ev.tts_ms || 0) };
      }

      if (ev.type === 'stt_partial' || ev.type === 'stt_final') {
        const c = this.calls.find(c => c.id === ev.session_id);
        if (c) {
          if (ev.type === 'stt_final') {
            c.transcript.push({ role: 'patient', text: ev.text, final: true, rtl: ['ur', 'pa'].includes(c.language) });
          } else {
            const last = c.transcript[c.transcript.length - 1];
            if (last && last.role === 'patient' && !last.final) {
              last.text = ev.text;
            } else {
              c.transcript.push({ role: 'patient', text: ev.text, final: false, rtl: ['ur', 'pa'].includes(c.language) });
            }
          }
        }
      }

      if (ev.type === 'assistant_response') {
        const c = this.calls.find(c => c.id === ev.session_id);
        if (c) {
          c.transcript.push({ role: 'ai', text: ev.text, final: true, rtl: ['ur', 'pa'].includes(c.language) });
        }
      }
    },

    async forceTransfer(callId) {
      await $store.app.api('/calls/' + callId + '/transfer', { method: 'POST', body: JSON.stringify({ target: 'nurse' }) });
      $store.app.addNotification('info', 'Call transferred to nurse');
    },

    async overrideLanguage(callId) {
      await $store.app.api('/calls/' + callId + '/language', { method: 'PATCH', body: JSON.stringify({ language: this.selectedLang }) });
      const c = this.calls.find(c => c.id === callId);
      if (c) c.language = this.selectedLang;
      this.overrideLangModal = false;
      $store.app.addNotification('success', 'Language overridden');
    },

    async endCall(callId) {
      await $store.app.api('/calls/' + callId + '/end', { method: 'POST' });
    },

    formatElapsed(secs) {
      const m = Math.floor(secs / 60).toString().padStart(2, '0');
      const s = (secs % 60).toString().padStart(2, '0');
      return m + ':' + s;
    },

    langBadgeClass(lang) {
      const m = { ur: 'bg-sky-500/20 text-sky-300 border-sky-500/30', pa: 'bg-green-500/20 text-green-300 border-green-500/30', en: 'bg-teal-500/20 text-teal-300 border-teal-500/30' };
      return m[lang] || 'bg-slate-500/20 text-slate-300 border-slate-500/30';
    },

    langLabel(lang) {
      const m = { ur: 'اردو · Urdu', pa: 'ਪੰਜਾਬੀ · Punjabi', en: 'English' };
      return m[lang] || lang;
    },

    stateColor(state) {
      const m = { connected: 'text-green-400', ringing: 'text-yellow-400', on_hold: 'text-orange-400', transferring: 'text-purple-400' };
      return m[state] || 'text-slate-400';
    }
  }"
  class="space-y-6">

  <!-- Header bar -->
  <div class="flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="flex items-center gap-2">
        <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
        <span class="text-slate-300 font-medium">Live Monitor</span>
      </div>
      <span class="bg-slate-700 text-slate-300 text-sm px-3 py-1 rounded-full" x-text="calls.length + ' call(s) active'"></span>
    </div>
    <div class="flex items-center gap-2 text-sm text-slate-400">
      <div :class="$store.app.wsConnected ? 'bg-teal-500' : 'bg-red-500'" class="w-2 h-2 rounded-full animate-pulse"></div>
      <span x-text="$store.app.wsConnected ? 'WebSocket Connected' : 'Reconnecting...'"></span>
    </div>
  </div>

  <!-- Empty State -->
  <template x-if="calls.length === 0">
    <div class="bg-slate-800 rounded-xl border border-slate-700 p-16 text-center">
      <div class="w-24 h-24 bg-slate-700 rounded-full flex items-center justify-center mx-auto mb-6">
        <svg class="w-12 h-12 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
        </svg>
      </div>
      <h3 class="text-xl font-semibold text-slate-300 mb-2">No active calls</h3>
      <p class="text-slate-500">The system is ready to receive incoming calls</p>
    </div>
  </template>

  <!-- Call Cards Grid -->
  <div class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-5">
    <template x-for="call in calls" :key="call.id">
      <div
        :class="call.emergency ? 'border-red-500 emergency-pulse' : 'border-slate-700'"
        class="bg-slate-800 rounded-xl border-2 shadow-lg flex flex-col overflow-hidden">

        <!-- Card Header -->
        <div :class="call.emergency ? 'bg-red-900/40' : 'bg-slate-700/40'" class="px-4 py-3 flex items-center justify-between border-b border-slate-700">
          <div class="flex items-center gap-3">
            <div :class="call.emergency ? 'bg-red-500' : 'bg-green-500'" class="w-2.5 h-2.5 rounded-full animate-pulse flex-shrink-0"></div>
            <div>
              <span class="text-slate-100 font-mono font-semibold text-sm">***<span x-text="call.phone.slice(-4)"></span></span>
              <template x-if="call.emergency">
                <span class="ml-2 bg-red-500 text-white text-xs px-2 py-0.5 rounded-full font-bold animate-pulse">EMERGENCY</span>
              </template>
            </div>
          </div>
          <div class="flex items-center gap-2">
            <span :class="langBadgeClass(call.language)" class="px-2.5 py-0.5 rounded-full text-xs font-medium border" x-text="langLabel(call.language)"></span>
            <span class="text-slate-400 text-xs font-mono" x-text="formatElapsed(call.elapsedSecs)"></span>
          </div>
        </div>

        <!-- State + Mic Level -->
        <div class="px-4 py-3 border-b border-slate-700 space-y-3">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <svg class="w-4 h-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"/></svg>
              <span :class="stateColor(call.state)" class="text-sm font-medium capitalize" x-text="call.state.replace('_', ' ')"></span>
            </div>
          </div>

          <!-- Mic Level Bar -->
          <div class="space-y-1">
            <div class="flex items-center justify-between">
              <span class="text-xs text-slate-500">Audio Level</span>
              <span class="text-xs text-slate-400" x-text="call.micLevel + '%'"></span>
            </div>
            <div class="h-2 bg-slate-700 rounded-full overflow-hidden">
              <div class="h-full bg-sky-500 rounded-full transition-all duration-100" :style="'width:' + call.micLevel + '%'"></div>
            </div>
          </div>

          <!-- Latency Breakdown -->
          <div class="grid grid-cols-4 gap-2 text-center">
            <div class="bg-slate-900/60 rounded-lg p-2">
              <p class="text-xs text-slate-500">STT</p>
              <p class="text-sm font-semibold text-sky-400" x-text="call.latency.stt + 'ms'"></p>
            </div>
            <div class="bg-slate-900/60 rounded-lg p-2">
              <p class="text-xs text-slate-500">LLM</p>
              <p class="text-sm font-semibold text-teal-400" x-text="call.latency.llm + 'ms'"></p>
            </div>
            <div class="bg-slate-900/60 rounded-lg p-2">
              <p class="text-xs text-slate-500">TTS</p>
              <p class="text-sm font-semibold text-green-400" x-text="call.latency.tts + 'ms'"></p>
            </div>
            <div class="bg-slate-900/60 rounded-lg p-2">
              <p class="text-xs text-slate-500">Total</p>
              <p class="text-sm font-semibold" :class="call.latency.total > 2000 ? 'text-red-400' : 'text-slate-300'" x-text="call.latency.total + 'ms'"></p>
            </div>
          </div>
        </div>

        <!-- Live Transcript -->
        <div class="flex-1 px-4 py-3 overflow-y-auto max-h-48 space-y-2 bg-slate-900/40">
          <template x-if="call.transcript.length === 0">
            <p class="text-slate-500 text-xs text-center py-4">Listening...</p>
          </template>
          <template x-for="(turn, idx) in call.transcript.slice(-6)" :key="idx">
            <div :class="turn.role === 'patient' ? 'flex justify-end' : 'flex justify-start'">
              <div
                :class="{
                  'bg-sky-500/20 text-sky-100': turn.role === 'patient',
                  'bg-slate-700 text-slate-100': turn.role === 'ai',
                  'opacity-60': !turn.final
                }"
                class="max-w-xs rounded-xl px-3 py-2 text-xs">
                <p :dir="turn.rtl ? 'rtl' : 'ltr'" :class="turn.rtl ? 'urdu-text' : ''" x-text="turn.text"></p>
              </div>
            </div>
          </template>
        </div>

        <!-- Action Buttons -->
        <div class="px-4 py-3 border-t border-slate-700 grid grid-cols-3 gap-2">
          <button @click="forceTransfer(call.id)" class="bg-yellow-500/20 hover:bg-yellow-500/30 text-yellow-400 text-xs py-2 px-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
            Transfer
          </button>
          <button
            @click="selectedCall = call.id; selectedLang = call.language; overrideLangModal = true"
            class="bg-sky-500/20 hover:bg-sky-500/30 text-sky-400 text-xs py-2 px-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"/></svg>
            Language
          </button>
          <button @click="endCall(call.id)" class="bg-red-500/20 hover:bg-red-500/40 text-red-400 text-xs py-2 px-3 rounded-lg font-medium transition-colors flex items-center justify-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M5 3a2 2 0 00-2 2v1c0 8.284 6.716 15 15 15h1a2 2 0 002-2v-3.28a1 1 0 00-.684-.948l-4.493-1.498a1 1 0 00-1.21.502l-1.13 2.257a11.042 11.042 0 01-5.516-5.517l2.257-1.128a1 1 0 00.502-1.21L9.228 3.683A1 1 0 008.279 3H5z"/></svg>
            End
          </button>
        </div>

      </div>
    </template>
  </div>

  <!-- Override Language Modal -->
  <div x-show="overrideLangModal" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
    <div @click.away="overrideLangModal = false" class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl p-6 w-full max-w-sm">
      <h3 class="text-lg font-semibold text-slate-100 mb-4">Override Language</h3>
      <div class="space-y-3 mb-6">
        <template x-for="opt in [{v:'ur', l:'Urdu (اردو)'}, {v:'pa', l:'Punjabi (ਪੰਜਾਬੀ)'}, {v:'en', l:'English'}]" :key="opt.v">
          <label class="flex items-center gap-3 cursor-pointer group">
            <input type="radio" :value="opt.v" x-model="selectedLang" class="w-4 h-4 text-sky-500 accent-sky-500" />
            <span class="text-slate-300 group-hover:text-slate-100 transition-colors" x-text="opt.l"></span>
          </label>
        </template>
      </div>
      <div class="flex gap-3">
        <button @click="overrideLangModal = false" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-xl font-medium transition-colors">Cancel</button>
        <button @click="overrideLanguage(selectedCall)" class="flex-1 bg-sky-500 hover:bg-sky-400 text-white py-2.5 rounded-xl font-medium transition-colors">Apply</button>
      </div>
    </div>
  </div>

</div>
{% endblock %}
