{% extends "base.html" %}
{% block title %}Users — Settings{% endblock %}
{% block page_title %}Settings — Users{% endblock %}

{% block content %}
<div
  x-data="{
    users: [],
    loading: true,
    showModal: false,
    editingUser: null,
    saving: false,
    form: { name: '', email: '', role: 'receptionist', password: '', password_confirm: '' },
    roles: ['admin', 'doctor', 'receptionist'],

    async init() {
      await this.loadUsers();
    },

    async loadUsers() {
      this.loading = true;
      const r = await $store.app.api('/users?page_size=100');
      if (r && r.ok) {
        const d = await r.json();
        this.users = d.items || d || [];
      }
      this.loading = false;
    },

    openCreate() {
      this.editingUser = null;
      this.form = { name: '', email: '', role: 'receptionist', password: '', password_confirm: '' };
      this.showModal = true;
    },

    openEdit(user) {
      this.editingUser = user;
      this.form = { name: user.name, email: user.email, role: user.role, password: '', password_confirm: '' };
      this.showModal = true;
    },

    async save() {
      if (this.form.password && this.form.password !== this.form.password_confirm) {
        $store.app.addNotification('warning', 'Passwords do not match');
        return;
      }
      this.saving = true;
      const payload = { name: this.form.name, email: this.form.email, role: this.form.role };
      if (this.form.password) payload.password = this.form.password;

      let r;
      if (this.editingUser) {
        r = await $store.app.api('/users/' + this.editingUser.id, { method: 'PUT', body: JSON.stringify(payload) });
      } else {
        payload.password = this.form.password;
        r = await $store.app.api('/users', { method: 'POST', body: JSON.stringify(payload) });
      }

      if (r && r.ok) {
        $store.app.addNotification('success', this.editingUser ? 'User updated' : 'User created');
        this.showModal = false;
        await this.loadUsers();
      } else {
        const err = await r?.json().catch(() => ({}));
        $store.app.addNotification('warning', err.detail || 'Save failed');
      }
      this.saving = false;
    },

    async deactivate(user) {
      if (!confirm('Deactivate ' + user.name + '? They will lose portal access.')) return;
      const r = await $store.app.api('/users/' + user.id, { method: 'PATCH', body: JSON.stringify({ is_active: false }) });
      if (r && r.ok) {
        $store.app.addNotification('success', user.name + ' deactivated');
        await this.loadUsers();
      }
    },

    async reactivate(user) {
      const r = await $store.app.api('/users/' + user.id, { method: 'PATCH', body: JSON.stringify({ is_active: true }) });
      if (r && r.ok) {
        $store.app.addNotification('success', user.name + ' reactivated');
        await this.loadUsers();
      }
    },

    roleBadge(role) {
      const map = { admin: 'bg-red-500/20 text-red-400', doctor: 'bg-sky-500/20 text-sky-400', receptionist: 'bg-teal-500/20 text-teal-400' };
      return map[role] || 'bg-slate-500/20 text-slate-400';
    }
  }"
  class="space-y-6">

  <!-- Header -->
  <div class="flex items-center justify-between">
    <div>
      <h2 class="text-base font-semibold text-slate-100">Staff Accounts</h2>
      <p class="text-xs text-slate-400 mt-0.5">Admin · Doctor · Receptionist roles</p>
    </div>
    <button @click="openCreate()" class="flex items-center gap-2 px-4 py-2 bg-sky-500 hover:bg-sky-400 text-white text-sm font-medium rounded-xl transition-colors">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
      Add User
    </button>
  </div>

  <!-- Users Table -->
  <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
    <div class="overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-xs text-slate-400 uppercase tracking-wide border-b border-slate-700 bg-slate-900/50">
            <th class="px-5 py-3">Name</th>
            <th class="px-5 py-3">Email</th>
            <th class="px-5 py-3">Role</th>
            <th class="px-5 py-3">Status</th>
            <th class="px-5 py-3">Last Login</th>
            <th class="px-5 py-3 text-right">Actions</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-700/50">
          <!-- Loading Skeletons -->
          <template x-if="loading">
            <template x-for="i in [1,2,3,4]" :key="i">
              <tr>
                <td class="px-5 py-3"><div class="h-4 w-32 skeleton rounded"></div></td>
                <td class="px-5 py-3"><div class="h-4 w-48 skeleton rounded"></div></td>
                <td class="px-5 py-3"><div class="h-5 w-20 skeleton rounded-full"></div></td>
                <td class="px-5 py-3"><div class="h-5 w-16 skeleton rounded-full"></div></td>
                <td class="px-5 py-3"><div class="h-4 w-28 skeleton rounded"></div></td>
                <td class="px-5 py-3"></td>
              </tr>
            </template>
          </template>
          <!-- Rows -->
          <template x-if="!loading">
            <template x-if="users.length === 0">
              <tr><td colspan="6" class="text-center text-slate-500 py-10">No users found</td></tr>
            </template>
          </template>
          <template x-if="!loading">
            <template x-for="user in users" :key="user.id">
              <tr class="hover:bg-slate-700/30 transition-colors">
                <td class="px-5 py-3">
                  <div class="flex items-center gap-3">
                    <div class="w-8 h-8 rounded-full bg-sky-500/20 flex items-center justify-center text-sky-400 text-sm font-bold flex-shrink-0" x-text="user.name ? user.name[0].toUpperCase() : '?'"></div>
                    <span class="font-medium text-slate-200" x-text="user.name"></span>
                  </div>
                </td>
                <td class="px-5 py-3 text-slate-400" x-text="user.email"></td>
                <td class="px-5 py-3">
                  <span :class="roleBadge(user.role)" class="px-2.5 py-0.5 rounded-full text-xs font-medium capitalize" x-text="user.role"></span>
                </td>
                <td class="px-5 py-3">
                  <span :class="user.is_active !== false ? 'bg-green-500/20 text-green-400' : 'bg-slate-600/40 text-slate-500'" class="px-2.5 py-0.5 rounded-full text-xs font-medium" x-text="user.is_active !== false ? 'Active' : 'Inactive'"></span>
                </td>
                <td class="px-5 py-3 text-slate-500 text-xs" x-text="user.last_login ? new Date(user.last_login).toLocaleDateString() : 'Never'"></td>
                <td class="px-5 py-3">
                  <div class="flex items-center justify-end gap-2">
                    <button @click="openEdit(user)" class="p-1.5 text-slate-400 hover:text-sky-400 hover:bg-sky-500/10 rounded-lg transition-colors" title="Edit">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                    </button>
                    <button x-show="user.is_active !== false" @click="deactivate(user)" class="p-1.5 text-slate-400 hover:text-red-400 hover:bg-red-500/10 rounded-lg transition-colors" title="Deactivate">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 18.364A9 9 0 005.636 5.636m12.728 12.728A9 9 0 015.636 5.636m12.728 12.728L5.636 5.636"/></svg>
                    </button>
                    <button x-show="user.is_active === false" @click="reactivate(user)" class="p-1.5 text-slate-400 hover:text-green-400 hover:bg-green-500/10 rounded-lg transition-colors" title="Reactivate">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    </button>
                  </div>
                </td>
              </tr>
            </template>
          </template>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Create/Edit Modal -->
  <div x-show="showModal" x-transition class="fixed inset-0 z-50 flex items-center justify-center bg-black/60 backdrop-blur-sm">
    <div @click.away="showModal = false" class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl w-full max-w-md mx-4 p-6">
      <div class="flex items-center justify-between mb-5">
        <h3 class="font-semibold text-slate-100" x-text="editingUser ? 'Edit User' : 'Create User'"></h3>
        <button @click="showModal = false" class="text-slate-400 hover:text-slate-200">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="space-y-4">
        <div>
          <label class="block text-sm text-slate-300 mb-1.5">Full Name</label>
          <input type="text" x-model="form.name" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1.5">Email</label>
          <input type="email" x-model="form.email" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1.5">Role</label>
          <select x-model="form.role" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500">
            <option value="admin">Admin (full access)</option>
            <option value="doctor">Doctor (own schedule)</option>
            <option value="receptionist">Receptionist (appointments + calls)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm text-slate-300 mb-1.5" x-text="editingUser ? 'New Password (leave blank to keep)' : 'Password'"></label>
          <input type="password" x-model="form.password" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
        <div x-show="form.password">
          <label class="block text-sm text-slate-300 mb-1.5">Confirm Password</label>
          <input type="password" x-model="form.password_confirm" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-sky-500" />
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button @click="save()" :disabled="saving" class="flex-1 flex items-center justify-center gap-2 py-2.5 bg-sky-500 hover:bg-sky-400 text-white font-semibold rounded-xl transition-colors disabled:opacity-50">
          <svg x-show="saving" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          <span x-text="saving ? 'Saving…' : (editingUser ? 'Update' : 'Create User')"></span>
        </button>
        <button @click="showModal = false" class="px-4 py-2.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-xl transition-colors">Cancel</button>
      </div>
    </div>
  </div>

</div>
{% endblock %}
