{% extends "base.html" %}
{% block title %}Appointments — AI Medical Receptionist{% endblock %}
{% block page_title %}Appointments{% endblock %}

{% block content %}
<div
  x-data="{
    calendar: null,
    doctors: [],
    selectedDoctor: '',
    quickBookModal: false,
    eventDetailModal: false,
    selectedEvent: null,
    newAppt: { doctor_id: '', appointment_type: 'consultation', date: '', time: '', patient_name: '', patient_phone: '' },
    savingAppt: false,

    // Paginated list view state
    listItems: [],
    listLoading: true,
    listTotal: 0,
    listPage: 1,
    listPageSize: 10,
    listSort: 'created_desc',
    listStatus: '',
    listType: '',
    apptDetail: null,
    apptDetailModal: false,

    async init() {
      await this.loadDoctors();
      this.$nextTick(() => this.initCalendar());
      this.loadList();
    },

    async loadList() {
      this.listLoading = true;
      const params = new URLSearchParams({
        page: this.listPage,
        page_size: this.listPageSize,
        sort: this.listSort
      });
      if (this.selectedDoctor) params.append('doctor_id', this.selectedDoctor);
      if (this.listStatus) params.append('status', this.listStatus);
      if (this.listType) params.append('appointment_type', this.listType);
      const r = await $store.app.api('/appointments/page?' + params.toString());
      if (r && r.ok) {
        const d = await r.json();
        this.listItems = d.items || [];
        this.listTotal = d.total || 0;
      } else {
        this.listItems = []; this.listTotal = 0;
      }
      this.listLoading = false;
    },

    get listTotalPages() {
      return Math.max(1, Math.ceil(this.listTotal / this.listPageSize));
    },
    listPrev() { if (this.listPage > 1) { this.listPage--; this.loadList(); } },
    listNext() { if (this.listPage < this.listTotalPages) { this.listPage++; this.loadList(); } },
    listReset() { this.listPage = 1; this.loadList(); },

    statusBadge(s) {
      const m = {
        scheduled: 'bg-sky-500/20 text-sky-400',
        confirmed: 'bg-green-500/20 text-green-400',
        completed: 'bg-teal-500/20 text-teal-400',
        cancelled: 'bg-slate-500/20 text-slate-400',
        no_show: 'bg-red-500/20 text-red-400',
        rescheduled: 'bg-amber-500/20 text-amber-400'
      };
      return m[s] || 'bg-slate-500/20 text-slate-400';
    },
    fmtPKT(iso) {
      if (!iso) return '—';
      return new Date(iso).toLocaleString('en-PK', { dateStyle: 'medium', timeStyle: 'short', timeZone: 'Asia/Karachi' });
    },
    openApptDetail(appt) {
      this.apptDetail = appt;
      this.apptDetailModal = true;
    },
    apptAge(year) {
      if (!year) return '—';
      const y = new Date().getFullYear();
      return (y - year) + ' yrs';
    },
    genderLabel(g) {
      const m = { M: 'Male', F: 'Female', O: 'Other' };
      return g ? (m[g] || g) : '—';
    },
    langLabel(l) {
      const m = { 'ur-PK': 'Urdu (PK)', 'pa-PK': 'Punjabi (PK)', 'en': 'English' };
      return l ? (m[l] || l) : '—';
    },
    maskPhone(p) {
      if (!p) return '—';
      return '*** *** ' + p.slice(-4);
    },

    async loadDoctors() {
      const r = await $store.app.api('/doctors?active=true&page_size=100');
      if (r && r.ok) {
        const d = await r.json();
        this.doctors = d.items || d || [];
      }
    },

    initCalendar() {
      const el = document.getElementById('calendar');
      if (!el || !window.FullCalendar) return;
      const self = this;
      this.calendar = new FullCalendar.Calendar(el, {
        initialView: 'dayGridMonth',
        headerToolbar: { left: 'prev,next today', center: 'title', right: 'dayGridMonth,timeGridWeek,timeGridDay,listWeek' },
        themeSystem: 'standard',
        height: 'auto',
        eventSources: [{ url: '/api/v1/appointments/calendar', method: 'GET', extraParams: () => ({ doctor_id: self.selectedDoctor }), headers: { 'Authorization': 'Bearer ' + $store.app.token } }],
        eventClick(info) {
          self.selectedEvent = {
            id: info.event.id,
            title: info.event.title,
            start: info.event.start,
            end: info.event.end,
            ...info.event.extendedProps
          };
          self.eventDetailModal = true;
        },
        dateClick(info) {
          self.newAppt.date = info.dateStr;
          self.quickBookModal = true;
        },
        eventContent(arg) {
          const isAI = arg.event.extendedProps?.source === 'ai';
          const html = `<div class='fc-event-main-frame p-1'>${isAI ? `<span style='font-size:10px;margin-right:3px'>🤖</span>` : ''}<span class='fc-event-title'>${arg.event.title}</span></div>`;
          return { html };
        }
      });
      this.calendar.render();
    },

    async saveAppointment() {
      this.savingAppt = true;
      const r = await $store.app.api('/appointments', {
        method: 'POST',
        body: JSON.stringify({ ...this.newAppt, source: 'manual' })
      });
      if (r && r.ok) {
        this.quickBookModal = false;
        this.newAppt = { doctor_id: '', appointment_type: 'consultation', date: '', time: '', patient_name: '', patient_phone: '' };
        if (this.calendar) this.calendar.refetchEvents();
        this.loadList();
        $store.app.addNotification('success', 'Appointment booked successfully');
      } else {
        $store.app.addNotification('warning', 'Failed to book appointment');
      }
      this.savingAppt = false;
    },

    async cancelAppointment(id) {
      const r = await $store.app.api('/appointments/' + id + '/cancel', { method: 'POST' });
      if (r && r.ok) {
        this.eventDetailModal = false;
        if (this.calendar) this.calendar.refetchEvents();
        this.loadList();
        $store.app.addNotification('info', 'Appointment cancelled');
      }
    },

    filterByDoctor() {
      if (this.calendar) this.calendar.refetchEvents();
      this.listReset();
    },

    printDaySheet() {
      const date = this.calendar ? this.calendar.getDate().toISOString().split('T')[0] : new Date().toISOString().split('T')[0];
      window.open('/api/v1/appointments/day-sheet?date=' + date + '&doctor_id=' + this.selectedDoctor, '_blank');
    },

    formatDateTime(dt) {
      if (!dt) return '—';
      return new Date(dt).toLocaleString('en-PK', { dateStyle: 'medium', timeStyle: 'short' });
    }
  }"
  class="space-y-5">

  <!-- Controls Bar -->
  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex items-center gap-3">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Filter by Doctor</label>
        <select x-model="selectedDoctor" @change="filterByDoctor" class="bg-slate-800 border border-slate-600 text-slate-100 rounded-lg px-3 py-2 text-sm focus:outline-none focus:border-sky-500">
          <option value="">All Doctors</option>
          <template x-for="doc in doctors" :key="doc.id">
            <option :value="doc.id" x-text="doc.name_en || doc.name"></option>
          </template>
        </select>
      </div>
    </div>
    <div class="flex items-center gap-3">
      <button @click="printDaySheet" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-300 px-4 py-2 rounded-lg text-sm transition-colors">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print Day Sheet
      </button>
      <button @click="quickBookModal = true" class="flex items-center gap-2 bg-sky-500 hover:bg-sky-400 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors shadow-lg shadow-sky-500/20">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        New Appointment
      </button>
    </div>
  </div>

  <!-- Calendar Container -->
  <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg p-5">
    <style>
      .fc { color: #cbd5e1; font-family: 'Inter', sans-serif; }
      .fc .fc-toolbar-title { color: #f1f5f9; font-size: 1.1rem; font-weight: 600; }
      .fc .fc-button { background: #334155; border-color: #475569; color: #cbd5e1; }
      .fc .fc-button:hover { background: #475569; }
      .fc .fc-button-primary:not(:disabled).fc-button-active { background: #0EA5E9; border-color: #0EA5E9; }
      .fc .fc-daygrid-day { background: transparent; }
      .fc .fc-daygrid-day:hover { background: rgba(14,165,233,0.05); }
      .fc .fc-day-today { background: rgba(14,165,233,0.08) !important; }
      .fc-theme-standard td, .fc-theme-standard th { border-color: #1e293b; }
      .fc-theme-standard .fc-scrollgrid { border-color: #1e293b; }
      .fc .fc-col-header-cell-cushion { color: #94a3b8; font-weight: 500; font-size: 0.75rem; text-transform: uppercase; }
      .fc .fc-daygrid-day-number { color: #94a3b8; }
      .fc .fc-list-event:hover td { background: rgba(14,165,233,0.1); }
      .fc .fc-list-day-cushion { background: #1e293b; }
      .fc .fc-list-day-text, .fc .fc-list-day-side-text { color: #94a3b8; }
    </style>
    <div id="calendar"></div>
  </div>

  <!-- Appointments List (paginated) -->
  <div class="bg-slate-800 rounded-xl border border-slate-700 shadow-lg">
    <div class="flex flex-wrap items-end justify-between gap-3 px-5 py-4 border-b border-slate-700">
      <div class="flex items-center gap-2">
        <h2 class="font-semibold text-slate-100">Appointments List</h2>
        <span class="text-sm text-slate-400" x-text="'· ' + listTotal + ' total'"></span>
      </div>
      <div class="flex flex-wrap items-end gap-3">
        <div>
          <label class="block text-xs text-slate-400 mb-1">Sort by</label>
          <select x-model="listSort" @change="listReset" class="bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            <option value="upcoming">Upcoming first (time asc)</option>
            <option value="recent">Most recent slot (time desc)</option>
            <option value="created_desc">Recently booked</option>
            <option value="created_asc">Oldest booked</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Status</label>
          <select x-model="listStatus" @change="listReset" class="bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            <option value="">All</option>
            <option value="scheduled">Scheduled</option>
            <option value="confirmed">Confirmed</option>
            <option value="completed">Completed</option>
            <option value="cancelled">Cancelled</option>
            <option value="no_show">No-show</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Type</label>
          <select x-model="listType" @change="listReset" class="bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            <option value="">All</option>
            <option value="consultation">Consultation</option>
            <option value="follow_up">Follow up</option>
            <option value="checkup">Checkup</option>
            <option value="emergency">Emergency</option>
            <option value="procedure">Procedure</option>
          </select>
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Per page</label>
          <select x-model.number="listPageSize" @change="listReset" class="bg-slate-900 border border-slate-600 text-slate-100 rounded-lg px-3 py-1.5 text-sm focus:outline-none focus:border-sky-500">
            <option :value="10">10</option>
            <option :value="20">20</option>
            <option :value="50">50</option>
          </select>
        </div>
      </div>
    </div>

    <template x-if="listLoading">
      <div class="p-4 space-y-2">
        <template x-for="i in [1,2,3,4,5]" :key="i">
          <div class="h-9 rounded skeleton"></div>
        </template>
      </div>
    </template>

    <template x-if="!listLoading">
      <div>
        <div class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-slate-700">
                <th class="text-left px-5 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">When (PKT)</th>
                <th class="text-left px-4 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Patient</th>
                <th class="text-left px-4 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Doctor</th>
                <th class="text-left px-4 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Type</th>
                <th class="text-left px-4 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Status</th>
                <th class="text-left px-4 py-3 text-xs font-medium text-slate-400 uppercase tracking-wide">Source</th>
              </tr>
            </thead>
            <tbody>
              <template x-if="listItems.length === 0">
                <tr><td colspan="6" class="text-center py-10 text-slate-400">No appointments match these filters.</td></tr>
              </template>
              <template x-for="appt in listItems" :key="appt.id">
                <tr @click="openApptDetail(appt)" class="border-b border-slate-700/50 hover:bg-slate-700/40 cursor-pointer transition-colors">
                  <td class="px-5 py-3 text-slate-300 whitespace-nowrap" x-text="fmtPKT(appt.slot_start_utc)"></td>
                  <td class="px-4 py-3 text-slate-300" x-text="appt.patient_name || '—'"></td>
                  <td class="px-4 py-3">
                    <span class="inline-flex items-center gap-2">
                      <span :style="'background:' + (appt.doctor_color || '#0EA5E9')" class="w-2 h-2 rounded-full"></span>
                      <span class="text-slate-300" x-text="appt.doctor_name || '—'"></span>
                    </span>
                  </td>
                  <td class="px-4 py-3 text-slate-300 capitalize" x-text="(appt.appointment_type || '').replace('_', ' ')"></td>
                  <td class="px-4 py-3">
                    <span :class="statusBadge(appt.status)" class="px-2.5 py-0.5 rounded-full text-xs font-medium capitalize" x-text="(appt.status || '').replace('_', ' ')"></span>
                  </td>
                  <td class="px-4 py-3">
                    <span class="text-xs text-slate-400 capitalize flex items-center gap-1">
                      <template x-if="appt.booking_source === 'ai'"><span>🤖</span></template>
                      <span x-text="appt.booking_source"></span>
                    </span>
                  </td>
                </tr>
              </template>
            </tbody>
          </table>
        </div>

        <div class="flex items-center justify-between px-5 py-3 border-t border-slate-700">
          <span class="text-sm text-slate-400" x-text="'Page ' + listPage + ' of ' + listTotalPages"></span>
          <div class="flex gap-2">
            <button @click="listPrev" :disabled="listPage <= 1" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed text-slate-300 rounded-lg text-sm transition-colors">Previous</button>
            <button @click="listNext" :disabled="listPage >= listTotalPages" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 disabled:opacity-40 disabled:cursor-not-allowed text-slate-300 rounded-lg text-sm transition-colors">Next</button>
          </div>
        </div>
      </div>
    </template>
  </div>

  <!-- Quick Book Modal -->
  <div x-show="quickBookModal" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
    <div @click.away="quickBookModal = false" class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-md">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-700">
        <h3 class="text-lg font-semibold text-slate-100">Quick Book Appointment</h3>
        <button @click="quickBookModal = false" class="text-slate-400 hover:text-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="p-6 space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Patient Name</label>
          <input type="text" x-model="newAppt.patient_name" placeholder="Patient full name" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-sky-500 placeholder-slate-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Patient Phone</label>
          <input type="tel" x-model="newAppt.patient_phone" placeholder="03001234567" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-sky-500 placeholder-slate-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Doctor</label>
          <select x-model="newAppt.doctor_id" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-sky-500">
            <option value="">Select doctor...</option>
            <template x-for="doc in doctors" :key="doc.id">
              <option :value="doc.id" x-text="doc.name_en || doc.name"></option>
            </template>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Date</label>
            <input type="date" x-model="newAppt.date" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-sky-500" />
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1.5">Time</label>
            <input type="time" x-model="newAppt.time" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-sky-500" />
          </div>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1.5">Type</label>
          <select x-model="newAppt.appointment_type" class="w-full bg-slate-900 border border-slate-600 text-slate-100 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-sky-500">
            <option value="consultation">Consultation</option>
            <option value="follow_up">Follow Up</option>
            <option value="checkup">Checkup</option>
            <option value="emergency">Emergency</option>
            <option value="procedure">Procedure</option>
          </select>
        </div>
      </div>
      <div class="px-6 pb-6 flex gap-3">
        <button @click="quickBookModal = false" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-xl font-medium transition-colors">Cancel</button>
        <button @click="saveAppointment" :disabled="savingAppt" class="flex-1 bg-sky-500 hover:bg-sky-400 disabled:bg-sky-800 text-white py-2.5 rounded-xl font-medium transition-colors flex items-center justify-center gap-2">
          <svg x-show="savingAppt" class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>
          Book Appointment
        </button>
      </div>
    </div>
  </div>

  <!-- Appointment + Patient Detail Modal (from list row click) -->
  <div x-show="apptDetailModal" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
    <div @click.away="apptDetailModal = false" class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-2xl max-h-[90vh] flex flex-col">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-700 flex-shrink-0">
        <div>
          <h3 class="text-lg font-semibold text-slate-100">Appointment Details</h3>
          <template x-if="apptDetail">
            <p class="text-xs text-slate-400 mt-0.5" x-text="fmtPKT(apptDetail.slot_start_utc) + ' (PKT)'"></p>
          </template>
        </div>
        <button @click="apptDetailModal = false" class="text-slate-400 hover:text-slate-100 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <template x-if="apptDetail">
        <div class="overflow-y-auto p-6 space-y-5">

          <!-- Patient Card -->
          <div class="bg-slate-900/60 rounded-xl p-4 border border-slate-700/50">
            <div class="flex items-center gap-2 mb-3">
              <svg class="w-4 h-4 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <h4 class="text-sm font-semibold text-slate-200 uppercase tracking-wide">Patient</h4>
            </div>
            <div class="flex items-center justify-between mb-3">
              <div>
                <p class="text-slate-100 font-semibold text-base" x-text="apptDetail.patient_name || '—'"></p>
                <template x-if="apptDetail.patient_name_ur">
                  <p class="urdu-text text-slate-400 text-sm" x-text="apptDetail.patient_name_ur"></p>
                </template>
              </div>
              <template x-if="apptDetail.patient_whatsapp">
                <span class="bg-green-500/20 text-green-400 px-2 py-0.5 rounded-full text-xs font-medium">WhatsApp opted-in</span>
              </template>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Gender</p>
                <p class="text-slate-300" x-text="genderLabel(apptDetail.patient_gender)"></p>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Age</p>
                <p class="text-slate-300" x-text="apptAge(apptDetail.patient_birth_year)"></p>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Language</p>
                <p class="text-slate-300" x-text="langLabel(apptDetail.patient_language)"></p>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Phone</p>
                <p class="text-slate-300 font-mono text-xs" x-text="maskPhone(apptDetail.patient_phone)"></p>
              </div>
            </div>
          </div>

          <!-- Doctor Card -->
          <div class="bg-slate-900/60 rounded-xl p-4 border border-slate-700/50">
            <div class="flex items-center gap-2 mb-3">
              <span :style="'background:' + (apptDetail.doctor_color || '#0EA5E9')" class="w-2.5 h-2.5 rounded-full"></span>
              <h4 class="text-sm font-semibold text-slate-200 uppercase tracking-wide">Doctor</h4>
            </div>
            <p class="text-slate-100 font-semibold" x-text="apptDetail.doctor_name || '—'"></p>
            <template x-if="apptDetail.doctor_name_ur">
              <p class="urdu-text text-slate-400 text-sm" x-text="apptDetail.doctor_name_ur"></p>
            </template>
            <div class="grid grid-cols-3 gap-3 mt-3 text-sm">
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Specialty</p>
                <p class="text-slate-300" x-text="apptDetail.doctor_specialty || '—'"></p>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Room</p>
                <p class="text-slate-300" x-text="apptDetail.doctor_room || '—'"></p>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Fee</p>
                <p class="text-slate-300" x-text="apptDetail.doctor_fee ? 'PKR ' + Number(apptDetail.doctor_fee).toLocaleString() : '—'"></p>
              </div>
            </div>
          </div>

          <!-- Appointment Card -->
          <div class="bg-slate-900/60 rounded-xl p-4 border border-slate-700/50">
            <h4 class="text-sm font-semibold text-slate-200 uppercase tracking-wide mb-3">Appointment</h4>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 text-sm">
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Status</p>
                <span :class="statusBadge(apptDetail.status)" class="inline-block px-2.5 py-0.5 rounded-full text-xs font-medium capitalize" x-text="(apptDetail.status || '').replace('_', ' ')"></span>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Type</p>
                <p class="text-slate-300 capitalize" x-text="(apptDetail.appointment_type || '').replace('_', ' ')"></p>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Source</p>
                <p class="text-slate-300 capitalize flex items-center gap-1">
                  <template x-if="apptDetail.booking_source === 'ai'"><span>🤖</span></template>
                  <span x-text="apptDetail.booking_source"></span>
                </p>
              </div>
              <div>
                <p class="text-xs text-slate-500 mb-0.5">Booked at</p>
                <p class="text-slate-300 text-xs" x-text="fmtPKT(apptDetail.created_at)"></p>
              </div>
            </div>
            <template x-if="apptDetail.notes">
              <div class="mt-3">
                <p class="text-xs text-slate-500 mb-1">Notes</p>
                <p class="text-slate-300 text-sm bg-slate-900/80 rounded-lg p-3" x-text="apptDetail.notes"></p>
              </div>
            </template>
          </div>

          <!-- Actions -->
          <div class="flex gap-3">
            <button @click="apptDetailModal = false" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-xl font-medium transition-colors text-sm">Close</button>
            <button
              x-show="apptDetail.status !== 'cancelled' && apptDetail.status !== 'completed'"
              @click="cancelAppointment(apptDetail.id); apptDetailModal = false"
              class="flex-1 bg-red-500/20 hover:bg-red-500/40 text-red-400 py-2.5 rounded-xl font-medium transition-colors text-sm">
              Cancel Appointment
            </button>
          </div>
        </div>
      </template>
    </div>
  </div>

  <!-- Event Detail Modal -->
  <div x-show="eventDetailModal" x-transition.opacity class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/70">
    <div @click.away="eventDetailModal = false" class="bg-slate-800 rounded-2xl border border-slate-700 shadow-2xl w-full max-w-md">
      <div class="flex items-center justify-between px-6 py-4 border-b border-slate-700">
        <h3 class="text-lg font-semibold text-slate-100">Appointment Detail</h3>
        <button @click="eventDetailModal = false" class="text-slate-400 hover:text-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <template x-if="selectedEvent">
        <div class="p-6 space-y-4">
          <div class="flex items-start justify-between">
            <div>
              <h4 class="text-slate-100 font-semibold text-lg" x-text="selectedEvent.title"></h4>
              <p class="text-slate-400 text-sm mt-0.5" x-text="formatDateTime(selectedEvent.start)"></p>
            </div>
            <span
              :class="selectedEvent.source === 'ai' ? 'bg-sky-500/20 text-sky-400' : 'bg-slate-600 text-slate-300'"
              class="px-3 py-1 rounded-full text-xs font-medium flex items-center gap-1">
              <template x-if="selectedEvent.source === 'ai'">
                <span>🤖</span>
              </template>
              <span x-text="selectedEvent.source === 'ai' ? 'AI Booked' : 'Manual'"></span>
            </span>
          </div>

          <div class="space-y-3">
            <div class="flex items-center gap-3">
              <svg class="w-5 h-5 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
              <span class="text-slate-300 text-sm" x-text="selectedEvent.doctor_name || 'Doctor'"></span>
            </div>
            <div class="flex items-center gap-3">
              <svg class="w-5 h-5 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
              <span class="text-slate-300 text-sm capitalize" x-text="(selectedEvent.appointment_type || 'consultation').replace('_', ' ')"></span>
            </div>
            <template x-if="selectedEvent.patient_phone">
              <div class="flex items-center gap-3">
                <svg class="w-5 h-5 text-slate-500 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/></svg>
                <span class="text-slate-300 text-sm font-mono" x-text="'***' + (selectedEvent.patient_phone || '').slice(-4)"></span>
              </div>
            </template>
          </div>

          <div class="flex gap-3 pt-2">
            <button @click="eventDetailModal = false" class="flex-1 bg-slate-700 hover:bg-slate-600 text-slate-300 py-2.5 rounded-xl font-medium transition-colors">Close</button>
            <button @click="cancelAppointment(selectedEvent.id)" class="flex-1 bg-red-500/20 hover:bg-red-500/40 text-red-400 py-2.5 rounded-xl font-medium transition-colors">Cancel Appointment</button>
          </div>
        </div>
      </template>
    </div>
  </div>

</div>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
{% endblock %}
