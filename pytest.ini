[pytest]
testpaths = tests
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --no-header
markers =
    unit: pure unit tests — no I/O, no network
    integration: tests that call FastAPI with a real (or in-memory) DB
    multilingual: language-correctness and DTMF routing tests
    load: concurrency / throughput tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
